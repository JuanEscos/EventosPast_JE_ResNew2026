name: Ejecución Periódica de Eventos

on:
  schedule:
    - cron: '0 0 * * 2' # Cada martes a las 00:00 UTC
  workflow_dispatch: # Permite ejecución manual desde GitHub

permissions:
  contents: write # Necesario para hacer commit y push de vuelta al repo

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          
      # ubuntu-latest ya incluye las bibliotecas del sistema necesarias para Chromium.
      # Evitamos `playwright install-deps`: invoca apt y puede bloquearse por mirrors externos.
      - name: Instalar browser de Playwright
        run: playwright install chromium

      - name: Setup Chrome para Selenium
        uses: browser-actions/setup-chrome@v1

      - name: Ejecutar Orquestador
        env:
          FLOW_EMAIL: ${{ secrets.FLOW_EMAIL }}
          FLOW_PASS: ${{ secrets.FLOW_PASS }}
          FLOW_EMAIL1: ${{ secrets.FLOW_EMAIL1 }}
          FLOW_PASS1: ${{ secrets.FLOW_PASS1 }}
          HEADLESS: True
        run: |
          cd scripts
          python main_orquestador.py

      # Conserva evidencia de RIALP para inspeccionar los HTML fuente y cada CSV
      # sin versionar todos los archivos intermedios en el repositorio.
      - name: "Diagnóstico RIALP: HTML y CSV"
        if: always()
        run: |
          mkdir -p diagnostic-rialp
          find scripts/Results/prints_html -type f -name '*_5ce8b9b7-e68b-4d16-bc4b-c9e82d9e718d_*_combined_results.html' -print0 2>/dev/null | \
            xargs -0 -r -I{} cp "{}" diagnostic-rialp/
          cp scripts/combined_results_con_cabecera_raw.csv diagnostic-rialp/ 2>/dev/null || true
          cp scripts/combined_results_con_cabecera_long.csv diagnostic-rialp/ 2>/dev/null || true
          cp scripts/combined_results_con_cabecera_union_meta_long.csv diagnostic-rialp/ 2>/dev/null || true
          cp scripts/combined_results_con_cabecera_wp.csv diagnostic-rialp/ 2>/dev/null || true
          grep -RIn 'Juez:' diagnostic-rialp --include='*.html' > diagnostic-rialp/jueces_en_html.txt || true
          python -c "import csv; from pathlib import Path; p=Path('scripts/combined_results_con_cabecera_wp.csv'); rows=list(csv.DictReader(p.open(encoding='utf-8-sig', newline=''))) if p.exists() else []; r=[x for x in rows if x.get('Evento')=='RIALP Summer Agility Cup 2026']; j=sorted({x.get('Juez','').strip() for x in r if x.get('Juez','').strip()}); print(f'RIALP_FILAS={len(r)}'); print(f'RIALP_FILAS_CON_JUEZ={sum(bool(x.get(\"Juez\", \"\").strip()) for x in r)}'); print('RIALP_JUECES=' + (' | '.join(j) if j else '(ninguno)'))" > diagnostic-rialp/resumen_juez_csv.txt

      - name: Subir diagnóstico RIALP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-rialp-${{ github.run_id }}
          path: diagnostic-rialp/
          if-no-files-found: warn
          retention-days: 14
          
      - name: Copiar resultados y hacer commit
        run: |
          # Crear el directorio destino si no existe
          mkdir -p NewWeb/Privado/ControlWeb/Data/
          
          # Copiar el archivo generado a la nueva ruta
          if [ -f "scripts/combined_results_con_cabecera_wp.csv" ]; then
            cp scripts/combined_results_con_cabecera_wp.csv NewWeb/Privado/ControlWeb/Data/combined_results_con_cabecera_wp.csv
          else
            echo "No se encontró el archivo combined_results_con_cabecera_wp.csv en la carpeta scripts/"
            exit 1
          fi
          
          # Configurar git para el commit
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Añadir y commitear el archivo si hay cambios
          git add NewWeb/Privado/ControlWeb/Data/combined_results_con_cabecera_wp.csv
          git diff --staged --quiet || git commit -m "Actualizar combined_results_con_cabecera_wp.csv"
          
          # Hacer push
          git push
          
      # JE_ResNew2026 fue retirada. El histórico se consulta en origen mediante
      # flow_db.php y JE_FlowData2025/2026, por lo que este pipeline termina al
      # publicar el CSV generado en el repositorio.

      - name: Enviar email si falla el pipeline
        if: failure()
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: jescosq@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ FlowAgility – ERROR en el pipeline"
          to: jescosq@gmail.com
          from: "FlowAgility Bot <jescosq@gmail.com>"
          body: |
            🐕 ORQUESTADOR FLOWAGILITY – ERROR DE EJECUCIÓN
            =================================================

            Estado:  ${{ job.status }}
            Commit:  ${{ github.sha }}
            Rama:    ${{ github.ref_name }}

            Ver detalles completos en GitHub Actions:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Este correo fue generado automáticamente por GitHub Actions.
